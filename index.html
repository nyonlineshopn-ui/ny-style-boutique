<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>NY Style Boutique</title>

        <style>
            * {
                  box-sizing: border-box;
                        margin: 0;
                              padding: 0;
                                  }

                                      body {
                                            background: #000;
                                                  color: #fff;
                                                        font-family: Arial, sans-serif;
                                                            }

                                                                header {
                                                                      text-align: center;
                                                                            padding: 35px 20px;
                                                                                  border-bottom: 1px solid #333;
                                                                                      }

                                                                                          header h1 {
                                                                                                font-size: 32px;
                                                                                                      letter-spacing: 3px;
                                                                                                          }

                                                                                                              header p {
                                                                                                                    margin-top: 10px;
                                                                                                                          color: #aaa;
                                                                                                                                letter-spacing: 2px;
                                                                                                                                    }

                                                                                                                                        nav {
                                                                                                                                              display: flex;
                                                                                                                                                    justify-content: center;
                                                                                                                                                          gap: 25px;
                                                                                                                                                                padding: 20px 10px;
                                                                                                                                                                      flex-wrap: wrap;
                                                                                                                                                                          }

                                                                                                                                                                              nav a {
                                                                                                                                                                                    color: white;
                                                                                                                                                                                          text-decoration: none;
                                                                                                                                                                                                font-weight: bold;
                                                                                                                                                                                                    }

                                                                                                                                                                                                        .hero {
                                                                                                                                                                                                              min-height: 60vh;
                                                                                                                                                                                                                    display: flex;
                                                                                                                                                                                                                          flex-direction: column;
                                                                                                                                                                                                                                align-items: center;
                                                                                                                                                                                                                                      justify-content: center;
                                                                                                                                                                                                                                            text-align: center;
                                                                                                                                                                                                                                                  padding: 30px;
                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                          .hero h2 {
                                                                                                                                                                                                                                                                font-size: 38px;
                                                                                                                                                                                                                                                                      margin-bottom: 15px;
                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                              .hero p {
                                                                                                                                                                                                                                                                                    color: #bbb;
                                                                                                                                                                                                                                                                                          margin-bottom: 30px;
                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                  .shop-button {
                                                                                                                                                                                                                                                                                                        background: white;
                                                                                                                                                                                                                                                                                                              color: black;
                                                                                                                                                                                                                                                                                                                    padding: 14px 28px;
                                                                                                                                                                                                                                                                                                                          text-decoration: none;
                                                                                                                                                                                                                                                                                                                                font-weight: bold;
                                                                                                                                                                                                                                                                                                                                      border-radius: 4px;
                                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                                            </style>
                                                                                                                                                                                                                                                                                                                                            </head>

                                                                                                                                                                                                                                                                                                                                            <body>

                                                                                                                                                                                                                                                                                                                                              <header>
                                                                                                                                                                                                                                                                                                                                                  <h1>NY STYLE BOUTIQUE</h1>
                                                                                                                                                                                                                                                                                                                                                      <p>EXCLUSIVE STYLE • ARUBA</p>
                                                                                                                                                                                                                                                                                                                                                        </header>

                                                                                                                                                                                                                                                                                                                                                          <nav>
                                                                                                                                                                                                                                                                                                                                                              <a href="#">WOMEN</a>
                                                                                                                                                                                                                                                                                                                                                                  <a href="#">MEN</a>
                                                                                                                                                                                                                                                                                                                                                                      <a href="#">ACCESSORIES</a>
                                                                                                                                                                                                                                                                                                                                                                          <a href="#">CART</a>
                                                                                                                                                                                                                                                                                                                                                                            </nav>

                                                                                                                                                                                                                                                                                                                                                                              <section class="hero">
                                                                                                                                                                                                                                                                                                                                                                                  <h2>Welcome to NY Style Boutique</h2>
                                                                                                                                                                                                                                                                                                                                                                                      <p>Exclusive fashion selected for you.</p>
                                                                                                                                                                                                                                                                                                                                                                                          <a class="shop-button" href="#">SHOP NOW</a>
                                                                                                                                                                                                                                                                                                                                                                                            </section>

                                                                                                                                                                                                                                                                                                                                                                                            </body>
                                                                                                                                                                                                                                                                                                                                                                                            </html>
